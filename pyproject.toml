[project]
name = "rideorown"
version = "0.1.0"
description = "Transparent ride-hailing and petrol-car ownership scenarios"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "streamlit>=1.65,<2",
    "pypdf>=6,<7",
    "pydantic>=2.11,<3",
    "pandas>=2.2,<3",
]

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/rideorown"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tmp*", ".test-*", "reports", "instructions", "data", "sample-data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
